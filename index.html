<!DOCTYPE html>
<html>
<body>

<iframe
  id="player"
  width="1"
  height="1"
  style="border:0;"
  allow="autoplay"
></iframe>

<script>
const videos = [
  "SSkL-n8zZ2U",
  "0B9gzAYCK50",
  "UQh7eFnmhpA",
  "3IBJG2SuQHE",
  "iis9u-e9Fbo",
  "0LIdlmPmH4A"
];

window.onload = () => {
  const id = videos[Math.floor(Math.random() * videos.length)];

  document.getElementById("player").src =
    `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&playsinline=1`;
};
</script>

</body>
</html>
